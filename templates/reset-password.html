<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password · Tender Ops</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8">

            <div class="text-center mb-8">

                <div class="mx-auto w-14 h-14 bg-teal-600 rounded-2xl flex items-center justify-center text-white mb-5">

                    <span class="text-2xl">🔑</span>

                </div>

                <h1 class="text-2xl font-bold text-slate-900">
                    Reset Password
                </h1>

                <p class="text-sm text-slate-500 mt-2">
                    Masukkan password baru untuk akun Anda.
                </p>

            </div>


            <form method="POST" class="space-y-5">

                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-2">

                        Password Baru

                    </label>

                    <input type="password" name="password" required minlength="8"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:bg-white focus:border-teal-500"
                        placeholder="Masukkan password baru">

                </div>


                <div>

                    <label class="block text-sm font-semibold text-slate-700 mb-2">

                        Konfirmasi Password

                    </label>

                    <input type="password" name="password_confirmation" required minlength="8"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:bg-white focus:border-teal-500"
                        placeholder="Ulangi password baru">

                </div>


                <button type="submit"
                    class="w-full py-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-semibold">

                    Ubah Password

                </button>

            </form>


            {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

            <div class="mt-5">

                {% for category, message in messages %}

                <div class="p-4 rounded-xl bg-slate-100 text-sm">
                    {{ message }}
                </div>

                {% endfor %}

            </div>

            {% endif %}

            {% endwith %}

        </div>

    </div>

</body>

</html>
